name: Validate and publish optical inventory

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check data and build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for query tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate inventory CSV
        run: python scripts/inventory.py --check

      - name: Test data validation
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test inventory queries
        run: node --test tests/*.test.mjs

      - name: Set site URL
        env:
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
        run: |
          python - <<'PY'
          import os
          owner, repository = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          origin = f'https://{owner.lower()}.github.io/'
          path = '' if repository.lower() == f'{owner.lower()}.github.io' else f'{repository}/'
          site_url = os.environ.get('PAGES_SITE_URL') or origin + path
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'SITE_URL={site_url.rstrip("/")}/\n')
          PY

      - name: Build MkDocs strictly
        run: python -m mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v6

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
